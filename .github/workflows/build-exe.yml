name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyflakes
      - name: Lint
        run: python -m pyflakes ai_image_studio tests
      - name: Test
        run: python -m pytest tests -q

  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build executable
        run: python -m PyInstaller packaging/ai_image_studio.spec --noconfirm
      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $env:AIS_PORT = "12300"
          $env:AIS_OPEN_BROWSER = "0"
          $proc = Start-Process -FilePath "dist/ai_image_studio.exe" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:12300/api/config" -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "executable did not serve /api/config within 30s" }
            $home_ = Invoke-WebRequest -Uri "http://127.0.0.1:12300/" -UseBasicParsing -TimeoutSec 10
            if ($home_.Content -notmatch "Face Preservation") {
              throw "GUI did not render the face-preservation controls"
            }
            Write-Host "Smoke test OK"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ai_image_studio-windows
          path: dist/ai_image_studio.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ai_image_studio.exe