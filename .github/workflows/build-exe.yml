name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Tkinter (needed for the GUI window) only ships with the full CPython
  # installer, so the toolchain is pinned to the version this project targets.
  PYTHON_VERSION: "3.10.11"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyflakes
      - name: Lint
        run: python -m pyflakes ai_image_studio tests
      - name: Test
        run: python -m pytest tests -q

  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build executable
        run: python -m PyInstaller packaging/ai_image_studio.spec --noconfirm
      - name: Verify the build is a windowed GUI executable
        shell: pwsh
        run: |
          # A GUI build uses the WINDOWS subsystem (2); a console build uses (3).
          $subsystem = python -c "import struct; d=open('dist/ai_image_studio.exe','rb').read(0x400); pe=struct.unpack_from('<I',d,0x3c)[0]; print(struct.unpack_from('<H',d,pe+0x5c)[0])"
          Write-Host "PE subsystem: $subsystem"
          if ($subsystem.Trim() -ne "2") { throw "expected a windowed (GUI) executable, got subsystem $subsystem" }
      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $env:AIS_PORT = "12300"
          $env:AIS_OPEN_BROWSER = "0"
          $proc = Start-Process -FilePath "dist/ai_image_studio.exe" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:12300/api/config" -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "executable did not serve /api/config within 30s" }
            $home_ = Invoke-WebRequest -Uri "http://127.0.0.1:12300/" -UseBasicParsing -TimeoutSec 10
            if ($home_.Content -notmatch "Face Preservation") {
              throw "GUI did not render the face-preservation controls"
            }
            # The capability contract must survive packaging: cloud creates from
            # the prompt, local preserves the face, and each reports its limits.
            $cfg = ($r.Content | ConvertFrom-Json)
            $providers = @{}
            foreach ($p in $cfg.providers) { $providers[$p.name] = $p }
            if (-not $providers.ContainsKey("cloud")) { throw "cloud provider missing from the bundle" }
            if (-not $providers["cloud"].capabilities.honors_prompt) {
              throw "cloud provider must report that it interprets the prompt"
            }
            if (-not $providers["local"].capabilities.supports_face_preservation) {
              throw "local provider must report face-preservation support"
            }
            if ($providers["local"].capabilities.honors_prompt) {
              throw "local provider must not claim to interpret the prompt"
            }
            if ($cfg.default_provider -ne "cloud") {
              throw "expected the generative cloud provider to be the default"
            }
            # A real generation through the packaged exe using the local
            # provider: deterministic, offline, and it exercises the full
            # upload -> face detect -> generate -> serve path.
            $face = "tests/assets/test_face.jpg"
            $up = curl.exe -s -F "image=@$face" "http://127.0.0.1:12300/api/upload" | ConvertFrom-Json
            if (-not $up.image.id) { throw "upload did not return an image id" }
            $localBody = @{ prompt = "a realistic oil painting"; input_image = $up.image.id; style = "oil_painting_realism"; number_of_images = 4; provider = "local"; preserve_face = $true; face_preservation_strength = "high" } | ConvertTo-Json
            $lgen = Invoke-WebRequest -Uri "http://127.0.0.1:12300/api/generate" -Method POST -Body $localBody -ContentType "application/json" -UseBasicParsing -TimeoutSec 120
            $ldata = ($lgen.Content | ConvertFrom-Json)
            if ($ldata.images.Count -ne 4) {
              throw "expected 4 local images, got $($ldata.images.Count)"
            }
            # Every batch image must be distinct, and the original photo must be
            # reported as preserved rather than silently replaced.
            $hashes = @()
            foreach ($im in $ldata.images) {
              if ($im.metadata.identity_preservation -notmatch "compositing") {
                throw "local provider must report face compositing, got '$($im.metadata.identity_preservation)'"
              }
              $bytes = Invoke-WebRequest -Uri ("http://127.0.0.1:12300/media/" + $im.path) -UseBasicParsing -TimeoutSec 30
              $hashes += [System.BitConverter]::ToString(
                [System.Security.Cryptography.MD5]::Create().ComputeHash($bytes.Content))
            }
            if (($hashes | Select-Object -Unique).Count -ne 4) {
              throw "the 4 local images are not distinct"
            }
            Write-Host "Local generation produced 4 distinct images with face compositing"

            # The generative cloud backend is the default, so verify it can
            # create an image from a prompt. The hosted service enforces a free
            # quota, so a transient 402 is tolerated (and must be reported
            # honestly) rather than failing the packaging build.
            $body = @{ prompt = "a red apple on a wooden table"; style = "oil_painting_realism"; number_of_images = 1; provider = "cloud" } | ConvertTo-Json
            try {
              $gen = Invoke-WebRequest -Uri "http://127.0.0.1:12300/api/generate" -Method POST -Body $body -ContentType "application/json" -UseBasicParsing -TimeoutSec 240
              $gdata = ($gen.Content | ConvertFrom-Json)
              if (-not $gdata.image_urls -or $gdata.image_urls.Count -lt 1) {
                throw "generation returned no images"
              }
              $img = Invoke-WebRequest -Uri ("http://127.0.0.1:12300" + $gdata.image_urls[0]) -UseBasicParsing -TimeoutSec 30
              if ($img.RawContentLength -lt 1000) {
                throw "generated image is suspiciously small ($($img.RawContentLength) bytes)"
              }
              Write-Host "Generated $($gdata.image_urls[0]) ($($img.RawContentLength) bytes)"
            } catch {
              # Provider failures arrive as HTTP 400 with the explanation in the
              # body, so inspect ErrorDetails as well as the exception message.
              $msg = "$($_.Exception.Message) $($_.ErrorDetails.Message)"
              if ($msg -match "quota" -or $msg -match "rate-limit" -or $msg -match "Insufficient balance") {
                Write-Host "Cloud quota unavailable; the service reported this honestly (network/service dependent, not a packaging failure)."
              } else {
                throw
              }
            }
            Write-Host "Smoke test OK"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ai_image_studio-windows
          path: dist/ai_image_studio.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ai_image_studio.exe