name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Tkinter (needed for the GUI window) only ships with the full CPython
  # installer, so the toolchain is pinned to the version this project targets.
  PYTHON_VERSION: "3.10.11"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyflakes
      - name: Lint
        run: python -m pyflakes ai_image_studio tests
      - name: Test
        run: python -m pytest tests -q

  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build executable
        run: python -m PyInstaller packaging/ai_image_studio.spec --noconfirm
      - name: Verify the build is a windowed GUI executable
        shell: pwsh
        run: |
          # A GUI build uses the WINDOWS subsystem (2); a console build uses (3).
          $subsystem = python -c "import struct; d=open('dist/ai_image_studio.exe','rb').read(0x400); pe=struct.unpack_from('<I',d,0x3c)[0]; print(struct.unpack_from('<H',d,pe+0x5c)[0])"
          Write-Host "PE subsystem: $subsystem"
          if ($subsystem.Trim() -ne "2") { throw "expected a windowed (GUI) executable, got subsystem $subsystem" }
      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $env:AIS_PORT = "12300"
          $env:AIS_OPEN_BROWSER = "0"
          $proc = Start-Process -FilePath "dist/ai_image_studio.exe" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:12300/api/config" -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "executable did not serve /api/config within 30s" }
            $home_ = Invoke-WebRequest -Uri "http://127.0.0.1:12300/" -UseBasicParsing -TimeoutSec 10
            if ($home_.Content -notmatch "Face Preservation") {
              throw "GUI did not render the face-preservation controls"
            }
            # The capability contract must survive packaging: cloud creates from
            # the prompt, local preserves the face, and each reports its limits.
            $cfg = ($r.Content | ConvertFrom-Json)
            $providers = @{}
            foreach ($p in $cfg.providers) { $providers[$p.name] = $p }
            if (-not $providers.ContainsKey("cloud")) { throw "cloud provider missing from the bundle" }
            if (-not $providers["cloud"].capabilities.honors_prompt) {
              throw "cloud provider must report that it interprets the prompt"
            }
            if (-not $providers["local"].capabilities.supports_face_preservation) {
              throw "local provider must report face-preservation support"
            }
            if ($providers["local"].capabilities.honors_prompt) {
              throw "local provider must not claim to interpret the prompt"
            }
            if ($cfg.default_provider -ne "cloud") {
              throw "expected the generative cloud provider to be the default"
            }
            # A real generation through the packaged exe: the prompt must travel
            # over the wire and a decodable image must come back. This is the
            # end-to-end check that "nothing is created" cannot regress.
            $body = @{ prompt = "a red apple on a wooden table"; style = "oil_painting_realism"; number_of_images = 1; provider = "cloud" } | ConvertTo-Json
            $gen = Invoke-WebRequest -Uri "http://127.0.0.1:12300/api/generate" -Method POST -Body $body -ContentType "application/json" -UseBasicParsing -TimeoutSec 180
            if ($gen.StatusCode -ne 200) { throw "generation returned HTTP $($gen.StatusCode)" }
            $gdata = ($gen.Content | ConvertFrom-Json)
            if (-not $gdata.image_urls -or $gdata.image_urls.Count -lt 1) {
              throw "generation returned no images"
            }
            $img = Invoke-WebRequest -Uri ("http://127.0.0.1:12300" + $gdata.image_urls[0]) -UseBasicParsing -TimeoutSec 30
            if ($img.RawContentLength -lt 1000) {
              throw "generated image is suspiciously small ($($img.RawContentLength) bytes)"
            }
            Write-Host "Generated $($gdata.image_urls[0]) ($($img.RawContentLength) bytes)"
            Write-Host "Smoke test OK"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ai_image_studio-windows
          path: dist/ai_image_studio.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ai_image_studio.exe